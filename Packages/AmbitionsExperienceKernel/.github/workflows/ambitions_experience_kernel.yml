name: AmbitionsExperienceKernel

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate-kernel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse package
        run: swift package dump-package >/tmp/ambitions_experience_kernel_package.json
      - name: Kernel lint
        run: python Scripts/ambitions_kernel_lint.py
      - name: Release report
        run: python Scripts/generate_release_report.py
