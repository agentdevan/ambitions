xcassets:
  inputs:
    - Sources/AmbitionsExperienceKernel/Resources/AmbitionsExperienceTokens.xcassets
  outputs:
    templateName: swift5
    output: Sources/AmbitionsExperienceKernel/Generated/Assets.swift
    params:
      enumName: AmbitionsExperienceAsset
      publicAccess: true
      bundle: Bundle.module

json:
  inputs:
    - Sources/AmbitionsExperienceKernel/Resources/Tokens/tokens.json
  outputs:
    templateName: runtime-swift5
    output: Sources/AmbitionsExperienceKernel/Generated/RawTokens.swift
    params:
      enumName: AmbitionsRawTokens
      publicAccess: true
