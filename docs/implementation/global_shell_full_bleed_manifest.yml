  - id: closure.overlay
    surface: Closure
    route_depth: closure_overlay
    crown_mode: reduced_close
    dock_mode: hidden
    atmosphere_mode: inspection
    primary_object: Closure Outcome
    screenshots: [default, proof, undo]
    accessibility: [voiceover_outcomes]
    status: not_started

  - id: inspection.proof
    surface: Inspection
    route_depth: inspection_overlay
    crown_mode: reduced_back
    dock_mode: hidden
    atmosphere_mode: inspection
    primary_object: Proof Inspection
    screenshots: [default]
    accessibility: [voiceover_inspection]
    status: not_started

red_fixtures:
  - docs/design/red_fixtures/time/current_failed_lifeshape_field.md
  - docs/design/red_fixtures/time/lifeshape_open_ring_gauge_failure.md
  - docs/design/red_fixtures/time/lifeshape_pressure_compression_ridge_failure.md
  - docs/design/red_fixtures/time/lifeshape_context_carried_overlay_failure.md

closeout_requires:
  - route_evidence_table
  - attached_or_committed_screenshots
  - target_vs_actual_critique
  - shell_integration_proof
  - accessibility_proof
  - device_proof_or_yellow_limitation
  - independent_visual_reviewer_for_visual_green
