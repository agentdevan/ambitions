  - scripts/ios26-flagship-run-sequential.sh
  - scripts/ios26-core-replacement-contract-check.py
  - scripts/ios26-core-replacement-proof-shape-check.py
  - scripts/setup-ambitions-proof-mcp.sh
  - .xcodebuildmcp/config.yaml
  - .xcodebuildmcp/codex-timeout-policy.json
