program_id: IOS26-FLAGSHIP
status: installed_not_run
runner_required: true
run_with: scripts/ambitions-codex-train.sh
direct_codex_execution: forbidden_unless_user_explicitly_bypasses_runner
release_readiness: unproven
claim_boundaries:
  - no_app_implementation_claim
  - no_release_readiness_claim
  - no_accessibility_verification_claim_without_proof
  - no_performance_validation_claim_without_measurements
  - no_product_replacement_claim_without_p0_contract_green
  - no_private_life_runtime_moat_claim_without_replayable_local_proof
stop_rules:
  - stop_on_red
  - never_skip_train_0
  - do_not_run_source_changing_trains_until_train_0_baseline_artifacts_exist
  - do_not_run_ios_26_target_bump_until_toolchain_proof_exists
