program_id: IOS26-FLAGSHIP
status: installed_not_run
runner_required: true
run_with: scripts/ambitions-codex-train.sh
direct_codex_execution: forbidden_unless_user_explicitly_bypasses_runner
release_readiness: unproven
claim_boundaries:
  - no_app_implementation_claim
  - no_release_readiness_claim
  - no_accessibility_verification_claim_without_proof
  - no_performance_validation_claim_without_measurements
stop_rules:
  - stop_on_red
  - never_skip_train_0
  - do_not_run_source_changing_trains_until_train_0_baseline_artifacts_exist
  - do_not_run_ios_26_target_bump_until_toolchain_proof_exists
installed_tooling:
  - scripts/ios26-flagship-preflight.py
  - scripts/ios26-flagship-proof-packet-check.py
  - scripts/ios26-api-ledger-check.py
  - scripts/ios26-flagship-run-sequential.sh
  - scripts/setup-ambitions-proof-mcp.sh
  - .xcodebuildmcp/config.yaml
  - .xcodebuildmcp/codex-timeout-policy.json
dependencies:
  TRAIN_00: []
  TRAIN_01: [TRAIN_00]
  TRAIN_02: [TRAIN_01]
  TRAIN_03: [TRAIN_00, TRAIN_01]
  TRAIN_04: [TRAIN_03]
  TRAIN_04A: [TRAIN_03, TRAIN_04]
  TRAIN_04B: [TRAIN_03, TRAIN_04, TRAIN_04A]
  TRAIN_05: [TRAIN_02, TRAIN_03, TRAIN_04, TRAIN_04A, TRAIN_04B]
  TRAIN_06: [TRAIN_02, TRAIN_03, TRAIN_04, TRAIN_04A, TRAIN_04B]
  TRAIN_07: [TRAIN_04, TRAIN_04A, TRAIN_04B]
  TRAIN_08: [TRAIN_03, TRAIN_04, TRAIN_04A, TRAIN_11_when_external_intake_is_included]
  TRAIN_09: [TRAIN_03, TRAIN_04, TRAIN_04A, TRAIN_11, TRAIN_13_for_public_accessibility_status]
  TRAIN_10: [TRAIN_03_through_TRAIN_09, TRAIN_04A, TRAIN_04B]
  TRAIN_11: [TRAIN_01, schema_decisions_from_TRAIN_03_TRAIN_04_TRAIN_10]
  TRAIN_12: [TRAIN_02, TRAIN_10, TRAIN_11]
  TRAIN_13: [TRAIN_05_through_TRAIN_12]
  TRAIN_14: [TRAIN_02, TRAIN_05_through_TRAIN_13]
  TRAIN_15: [TRAIN_00]
  TRAIN_16: [TRAIN_00_through_TRAIN_15, TRAIN_04A, TRAIN_04B_through_full_train_chain]
proof_artifact_roots:
  - build/reports/ios26-baseline/
  - build/reports/ios26-migration/
