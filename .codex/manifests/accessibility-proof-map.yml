status: active
version: 1
date: "2026-05-08"
purpose: "Map UI-affecting work to accessibility proof packet requirements."

required_fields:
  - surface
  - touched_files
  - VoiceOver_order
  - Dynamic_Type_behavior
  - Reduce_Motion_equivalent
  - tap_target_risks
  - color_only_meaning_check
  - motion_only_meaning_check
  - privacy_redaction_readability
  - known_limitations
  - human_device_follow_up

route_requirements:
  Today UI:
    - VoiceOver reads Start here before secondary proof details.
    - Reality Rail / Meridian state must not rely on color alone.
    - Action Closure choices must be explicit controls.

  Goals UI:
    - Goal categories must remain navigable without forced ranking.
    - Proof Spine meaning must not rely on color alone.

  Capture UI:
    - Composer input and placement choices must support keyboard and motor alternatives.
    - Voice unavailable states must be honest.

  Plan UI:
    - Protected time, free time, and unavailable time must be distinguishable without color alone.
    - Reflow decision controls must be explicit and reversible.

  You UI:
    - Grouped navigation rows must have clear labels and traits.
    - Memory/trust controls must make review/delete/correction posture clear.

claim_boundary:
  public_accessibility_conformance_requires: "human/device proof or dedicated accessibility audit evidence"
  acx_packet_only_proves: "review fields were produced, not public conformance"
