status: active
version: 1
date: "2026-05-08"
purpose: "Map changed paths to likely test and validation lanes."

impact:
  scripts_ai:
    match:
      - "scripts/ai/**"
    validation:
      - "python3 -m py_compile scripts/ai/*.py"
      - "python3 scripts/ai/acx_local.py bundle codex-os"

  codex_docs:
    match:
      - "docs/codex/**"
      - ".codex/**"
      - "AGENTS.md"
    validation:
      - "python3 scripts/ai/acx_local.py bundle docs"
      - "python3 scripts/ai/acx_repair.py diagnose"

  swift_source:
    match:
      - "Native/**"
      - "Sources/**"
      - "AppUI/Sources/**"
    validation:
      - "python3 scripts/ai/acx_local.py bundle ui"
      - "build-help"
      - "test-help"
    note: "Actual build/test claims require documented local commands and raw logs."

  project_config:
    match:
      - "project.yml"
      - "Package.swift"
    validation:
      - "python3 scripts/ai/acx_local.py run xcodegen-generate"
      - "python3 scripts/ai/acx_local.py bundle build-triage"
