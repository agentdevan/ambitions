version: 1
status: active
date: "2026-05-07"
default_mode: advisory
strict_mode_env: "CQS_STRICT=1"
gates:
  - name: "Source Truth Gate"
    scripts: ["python3 scripts/ai/acx.py gate all docs/codex .codex AGENTS.md"]
    proof: ["read list", "owner docs", "raw ACX output"]
  - name: "Scope Gate"
    scripts: ["python3 scripts/ai/acx_local.py run changed-files", "python3 scripts/ai/acx_local.py run diff-names"]
    proof: ["changed files", "forbidden files not touched"]
  - name: "Canon Drift Gate"
    scripts: ["bash scripts/cqs-product-drift-scan.sh"]
    proof: ["raw scan log"]
  - name: "Accessibility Gate"
    scripts: ["bash scripts/cqs-accessibility-motion-scan.sh"]
    proof: ["raw scan log", "rendered proof when UI changes"]
  - name: "Privacy / Legal / App Store Gate"
    scripts: ["bash scripts/cqs-privacy-security-claim-scan.sh"]
    proof: ["raw scan log", "claim boundary"]
  - name: "Performance / Battery Gate"
    scripts: ["bash scripts/cqs-performance-budget-scan.sh"]
    proof: ["raw scan log", "profiling logs when claimed"]
  - name: "Evidence Packet Gate"
    scripts: []
    proof: [".codex/templates/evidence-packet.md fields or equivalent final report"]
