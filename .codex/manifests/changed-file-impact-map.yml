status: active
version: 1
date: "2026-05-08"
purpose: "Map changed paths to required route, validation, and closeout lanes."

rules:
  - name: codex_os_tooling
    match:
      - "scripts/ai/**"
    route: "Repo Hygiene"
    bundles:
      - codex-os
    extra_validation:
      - "python3 -m py_compile scripts/ai/acx.py scripts/ai/acx_local.py scripts/ai/acx_impact.py scripts/ai/acx_closeout.py scripts/ai/acx_repair.py"
    gates:
      - release-claim-firewall
      - evidence-packet

  - name: codex_docs
    match:
      - "docs/codex/**"
      - ".codex/**"
      - "AGENTS.md"
    route: "Canon Drift"
    bundles:
      - docs
      - batch-closeout
    gates:
      - source-truth
      - scope
      - release-claim-firewall
      - report

  - name: canon_docs
    match:
      - "docs/canon/**"
    route: "Canon Drift"
    bundles:
      - docs
      - batch-closeout
    gates:
      - source-truth
      - canon-drift
      - release-claim-firewall

  - name: today_ui
    match:
      - "Native/Ambitions/Features/Today/**"
      - "Sources/**Today**"
    route: "Today UI"
    bundles:
      - ui
      - batch-closeout
    gates:
      - top-level-composition
      - visual-quality
      - accessibility
      - canon-drift

  - name: goals_ui
    match:
      - "Native/Ambitions/Features/Goals/**"
    route: "Goals UI"
    bundles:
      - ui
      - batch-closeout
    gates:
      - visual-quality
      - accessibility
      - proof-receipt
      - canon-drift

  - name: capture_ui
    match:
      - "Native/Ambitions/Features/Capture/**"
    route: "Capture UI"
    bundles:
      - ui
      - batch-closeout
    gates:
      - composer-first
      - privacy-hidden-learning
      - accessibility

  - name: plan_ui
    match:
      - "Native/Ambitions/Features/Plan/**"
    route: "Plan UI"
    bundles:
      - ui
      - batch-closeout
    gates:
      - calendar-clone-rejection
      - silent-reflow-rejection
      - accessibility

  - name: you_ui
    match:
      - "Native/Ambitions/Features/Profile/**"
      - "Native/Ambitions/Features/You/**"
    route: "You UI"
    bundles:
      - ui
      - batch-closeout
    gates:
      - you-terminology
      - privacy-trust-memory
      - accessibility

  - name: project_config
    match:
      - "project.yml"
      - "Package.swift"
      - "*.xcodeproj/**"
    route: "Xcode / Toolchain"
    bundles:
      - build-triage
      - batch-closeout
    gates:
      - validation
      - senior-architecture

fallback:
  route: "Repo Hygiene"
  bundles:
    - quick
  gates:
    - scope
    - report
