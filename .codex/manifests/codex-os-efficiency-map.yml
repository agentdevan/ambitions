status: active
date: "2026-05-07"
purpose: "Map the Ambitions Codex OS usage-efficiency layer."
subsystems:
  ACX:
    name: "Ambitions Command eXtractor"
    files:
      - "scripts/ai/acx.py"
      - "scripts/ai/acx"
    duties:
      - "bounded file reads"
      - "saved-log summarization"
      - "changed-file grouping from saved status text"
      - "advisory gates"
      - "gate reports"
    command_execution: false
  ARC:
    name: "Ambitions Route Context"
    files:
      - ".codex/routes/README.md"
    duties:
      - "task-specific read lists"
      - "allowed/forbidden path reminders"
      - "gate routing"
  AGE:
    name: "Ambitions Gate Engine"
    files:
      - "docs/codex/CODEX_GATE_ENGINE.md"
      - "docs/codex/CODEX_QUALITY_SYSTEM_GATE_MATRIX.md"
      - "docs/codex/CODEX_QUALITY_SYSTEM_SCRIPT_MAP.md"
    duties:
      - "advisory scans"
      - "strict closeout mode when requested"
  AEP:
    name: "Ambitions Evidence Packets"
    files:
      - "docs/codex/CODEX_EVIDENCE_STANDARD.md"
    duties:
      - "claim-proof mapping"
      - "raw log rules"
  ABS:
    name: "Ambitions Batch State"
    files:
      - ".codex/reports/current-batch-train-state.md"
      - ".codex/state/active-batch.yml"
      - ".codex/state/yellow-ledger.md"
      - ".codex/state/hard-red-ledger.md"
    duties:
      - "resumable train state"
      - "compact Yellow/Red indexing"
  ASK:
    name: "Ambitions Skills Kit"
    files:
      - ".codex/skills/*.md"
      - "docs/codex/CODEX_SKILLS_KIT.md"
    duties:
      - "role routing"
      - "agent specialization"
claim_boundary:
  summarized_output_only:
    allowed_for:
      - "navigation"
      - "routine summaries"
      - "advisory scans"
    not_allowed_for:
      - "build pass"
      - "test pass"
      - "release readiness"
      - "device proof"
      - "public accessibility proof"
      - "legal/privacy compliance"
