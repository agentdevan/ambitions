version: 1
status: active
date: "2026-05-07"
purpose: "Compact map for the Ambitions Codex OS six-subsystem model."
subsystems:
  ACX:
    name: "Ambitions Command eXtractor"
    owners:
      - "scripts/ai/acx.py"
      - "scripts/ai/acx_local.py"
      - "docs/codex/CODEX_ACX_LOCAL_EXECUTOR.md"
    saves_context_by:
      - "bounded reads instead of full-file dumps"
      - "saved raw log summarization"
      - "changed-file grouping by Ambitions concern"
      - "allowlisted local command summaries"
  ARC:
    name: "Ambitions Route Context"
    owners:
      - ".codex/routes/README.md"
      - "docs/codex/CODEX_ROUTE_CONTEXT_PROTOCOL.md"
    saves_context_by:
      - "route-first read lists"
      - "forbidden edit lists before discovery"
  AGE:
    name: "Ambitions Gate Engine"
    owners:
      - "docs/codex/CODEX_GATE_ENGINE.md"
      - ".codex/manifests/gate-engine-map.yml"
    saves_context_by:
      - "gate families mapped to scripts and proof"
      - "strict/advisory language"
  AEP:
    name: "Ambitions Evidence Packets"
    owners:
      - "docs/codex/CODEX_EVIDENCE_STANDARD.md"
      - ".codex/templates/evidence-packet.md"
    saves_context_by:
      - "one packet format for commands, exit codes, logs, proof, and non-claims"
  ABS:
    name: "Ambitions Batch State"
    owners:
      - ".codex/state/"
      - "docs/codex/CODEX_BATCH_TRAIN_PROTOCOL.md"
      - "docs/codex/CODEX_BATCH_RESTART_PROMPT_PROTOCOL.md"
    saves_context_by:
      - "compact mirrors"
      - "restart prompts"
      - "Yellow and hard Red ledgers"
  ASK:
    name: "Ambitions Skills Kit"
    owners:
      - "docs/codex/CODEX_SKILLS_KIT.md"
      - ".codex/manifests/skills-routing-map.yml"
    saves_context_by:
      - "existing skill reuse"
      - "route to gate to report mapping"
owner_precedence:
  - "Current user directive"
  - "AGENTS.md"
  - "Ambitions 3.0 canon and owner docs"
  - "Current source code"
  - "Raw validation logs"
  - "Codex OS compact maps"
