version: 2
status: active-operating-support
date: "2026-05-09"
authority:
  truth_index: "docs/truth/README.md"
  inventory: "docs/status/codex-agents-skill-inventory.md"
  rule: "If this routing map conflicts with docs/truth/*, the truth files win."
  boundary: "Codex operating support only; not product source truth, shipped behavior proof, validation proof, release proof, or approval to change app behavior."
forbidden_skill_roots:
  - ".agents/skills/supabase/"
  - ".agents/skills/supabase-postgres-best-practices/"
notes:
  - "Use only tracked skill names from .codex/skills/."
  - "Product or implementation builder skills are candidate support until selected by an active batch."
  - "Historical Ambitions 3.0 / 4.0 / PXOS / SI wording is subordinate to docs/truth/*."
families:
  Truth Steward:
    primary_route: "Truth Wiring / Canon Drift / Stale Docs"
    classification: active
    skills: ["repo-truth-enforcer", "source-truth-reconciler", "stale-doc-reconciler", "active-canon-linker", "legacy-language-sweeper", "file-inventory-classifier"]
    allowed_paths: ["docs/truth/", "docs/status/", "docs/AmbitionsCanon/", "docs/codex/", ".codex/", ".agents/"]
    forbidden_paths: ["Native/Ambitions/ unless explicitly scoped"]
    gates: ["Source Truth", "Deprecated Language", "Evidence Packet"]
    validation_tier: "docs scan"
    report_format: "green-yellow-red report"
  Build Sheriff:
    primary_route: "Build Failure / Toolchain / XcodeGen"
    classification: active
    skills: ["build-failure-triage-skill", "build-test-pack-runner", "xcodegen-target-writer", "xcodegen-target-updater", "xcode-version-verifier", "xcodegen-version-verifier", "simulator-selection-skill", "simulator-runtime-manager"]
    allowed_paths: ["project.yml", "scripts/", "docs/codex/", ".codex/", "failing owner source paths"]
    forbidden_paths: ["unrelated SwiftUI refactors", "release claims without logs"]
    gates: ["Validation", "Source Truth", "Senior Architecture"]
    validation_tier: "raw local build/test logs"
    report_format: "failure report"
  Batch Conductor:
    primary_route: "Global Batch Train / Resume / Repair"
    classification: active
    skills: ["phase-executor", "batch-registry-reconciler", "diff-scope-controller", "touch-budget-enforcer", "post-run-closeout-writer", "evidence-gate-reporter"]
    allowed_paths: ["docs/codex/", ".codex/reports/", ".codex/templates/", "active batch owner files"]
    forbidden_paths: ["unowned next-batch files", "broad source rewrites without batch scope"]
    gates: ["Route Context", "Evidence Packet", "Report"]
    validation_tier: "batch-specific"
    report_format: "green-yellow-red report"
  Evidence Reviewer:
    primary_route: "Any"
    classification: active
    skills: ["evidence-gate-reporter", "evidence-hierarchy-enforcer", "release-claim-blocker", "post-run-closeout-writer", "xcresult-evidence-extractor", "manual-verification-blocker"]
    allowed_paths: ["docs/audits/", "docs/status/", ".codex/templates/", ".codex/reports/", "docs/codex/"]
    forbidden_paths: ["claiming proof without logs", "TestFlight/App Store/device claims without evidence"]
    gates: ["Evidence Packet", "Report", "Release Claim Firewall"]
    validation_tier: "raw logs and exit codes"
    report_format: "evidence packet"
  Product Implementation Builder:
    primary_route: "Scoped Feature / Product Surface / Domain Builder"
    classification: candidate
    skills: ["ambitions-operating-shell-builder", "ambitions-ios-surface-polisher", "capture-flow-implementer", "reality-rail-builder", "start-here-recommendation-builder", "goal-mission-control-builder", "plan-life-suite-builder", "step-detail-builder", "step-session-builder", "trust-memory-control-plane-builder"]
    allowed_paths: ["active batch owner files only"]
    forbidden_paths: ["unscoped source changes", "release/readiness claims", "external-provider architecture changes"]
    gates: ["Active Batch Scope", "Source Truth", "Validation Boundary"]
    validation_tier: "batch-specific local validation"
    report_format: "implementation closeout"
