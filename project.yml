name: Ambitions
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
packages:
  AmbitionsPackages:
    path: .
targets:
  Ambitions:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Native/Ambitions
        excludes:
          - "**/*.md"
          - "Resources/**"
          - "Support/Info.plist"
    resources:
      - path: Native/Ambitions/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ambitions.ios
        PRODUCT_NAME: Ambitions
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Native/Ambitions/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        DEVELOPMENT_ASSET_PATHS: Native/Ambitions/PreviewSupport
        CODE_SIGN_ENTITLEMENTS: Native/Ambitions/Support/Ambitions.entitlements
    dependencies:
      - package: AmbitionsPackages
        product: AmbitionsDesignSystem
      - package: AmbitionsPackages
        product: AmbitionsWidgetUI
      - target: AmbitionsWidgetExtension
        embed: true
      - target: AmbitionsShareExtension
        embed: true
  AmbitionsWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Native/AmbitionsWidgetExtension
        excludes:
          - "**/*.md"
      - path: Native/Ambitions/ExternalSnapshots/ExternalSurfaceSnapshotContracts.swift
      - path: Native/Ambitions/ExternalSnapshots/ExternalSurfaceContractModels.swift
      - path: Native/Ambitions/ExternalSnapshots/ExternalWidgetProjection.swift
      - path: Native/Ambitions/ExternalSnapshots/SharedExternalSnapshotStore.swift
      - path: Native/Ambitions/ExternalSnapshots/ExternalSurfaceActionPayloads.swift
      - path: Native/Ambitions/ExternalSnapshots/ExternalSurfaceControlContracts.swift
      - path: Native/Ambitions/ExternalSnapshots/NextStepActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ambitions.ios.widgetextension
        PRODUCT_NAME: AmbitionsWidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Native/AmbitionsWidgetExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_ENTITLEMENTS: Native/AmbitionsWidgetExtension/AmbitionsWidgetExtension.entitlements
  AmbitionsShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Native/AmbitionsShareExtension
        excludes:
          - "**/*.md"
      - path: Native/Ambitions/ExternalSnapshots/ExternalCreationContracts.swift
      - path: Native/Ambitions/ExternalSnapshots/ExternalSurfaceActionPayloads.swift
      - path: Native/Ambitions/ExternalSnapshots/ExternalSurfaceSnapshotContracts.swift
      - path: Native/Ambitions/ExternalSnapshots/ExternalSurfaceContractModels.swift
      - path: Native/Ambitions/ExternalSnapshots/SharedExternalSnapshotStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ambitions.ios.shareextension
        PRODUCT_NAME: AmbitionsShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Native/AmbitionsShareExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_ENTITLEMENTS: Native/AmbitionsShareExtension/AmbitionsShareExtension.entitlements
    dependencies:
      - sdk: AppIntents.framework
  AmbitionsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Native/AmbitionsTests
        excludes:
          - "**/*.md"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ambitions
      - package: AmbitionsPackages
        product: AmbitionsDesignSystem
  AmbitionsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Native/AmbitionsUITests
        excludes:
          - "**/*.md"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ambitions
      - sdk: AppIntents.framework
schemes:
  Ambitions:
    build:
      targets:
        Ambitions: all
        AmbitionsWidgetExtension: all
        AmbitionsShareExtension: all
        AmbitionsTests: [test]
        AmbitionsUITests: [test]
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: AmbitionsTests
        - name: AmbitionsUITests
