name: Ambitions Report Screenshot Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ambitions-report-screenshots.yml
      - Native/AmbitionsUITests/**
      - Native/Ambitions/Features/**
      - Native/Ambitions/App/**
      - Sources/Components/**

permissions:
  contents: read

env:
  SCREENSHOT_BATCH: report-screenshot-proof

concurrency:
  group: ambitions-report-screenshot-proof
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain proof
        shell: bash
        run: |
          set -euo pipefail
          sw_vers || true
          xcodebuild -version
          xcode-select -p
          git status --short --branch
          git rev-parse HEAD
          xcrun simctl list devices available | sed -n '1,160p'
          command -v xcparse || true

      - name: Build for screenshot UI tests
        id: build_for_testing
        shell: bash
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-sim-health.sh --repair --json | tee artifacts-report-sim-health.json || true
          scripts/ambitions-xcode-build-for-testing.sh \
            --batch "${SCREENSHOT_BATCH}" \
            --results-dir ".codex/xcode-results" \
            --logs-dir ".codex/xcode-logs" \
            --summaries-dir ".codex/xcode-summaries"

      - name: Capture canonical shell screenshots
        id: shell_shots
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-test-focused.sh \
            --batch "${SCREENSHOT_BATCH}" \
            --only-testing "AmbitionsUITests/AmbitionsUITests/testAFRI005ShellScreenshotBaselineCapturesCanonicalTabs" \
            --results-dir ".codex/xcode-results" \
            --logs-dir ".codex/xcode-logs" \
            --summaries-dir ".codex/xcode-summaries"

      - name: Capture Today screenshot matrix
        id: today_shots
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-test-focused.sh \
            --batch "${SCREENSHOT_BATCH}" \
            --only-testing "AmbitionsUITests/AmbitionsUITests/testAMB962TodayReconstructionScreenshotMatrix" \
            --results-dir ".codex/xcode-results" \
            --logs-dir ".codex/xcode-logs" \
            --summaries-dir ".codex/xcode-summaries"

      - name: Capture Goals screenshot matrix
        id: goals_shots
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-test-focused.sh \
            --batch "${SCREENSHOT_BATCH}" \
            --only-testing "AmbitionsUITests/AmbitionsUITests/testAMB963GoalsReconstructionScreenshotMatrix" \
            --results-dir ".codex/xcode-results" \
            --logs-dir ".codex/xcode-logs" \
            --summaries-dir ".codex/xcode-summaries"

      - name: Capture activated Capture screenshots
        id: capture_shots
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-test-focused.sh \
            --batch "${SCREENSHOT_BATCH}" \
            --only-testing "AmbitionsUITests/AmbitionsUITests/testAMB967CaptureCreateGoalScreenshotMatrix" \
            --results-dir ".codex/xcode-results" \
            --logs-dir ".codex/xcode-logs" \
            --summaries-dir ".codex/xcode-summaries"

      - name: Capture Time screenshot matrix
        id: time_shots
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-test-focused.sh \
            --batch "${SCREENSHOT_BATCH}" \
            --only-testing "AmbitionsUITests/AmbitionsUITests/testAMB964TimeReconstructionScreenshotMatrix" \
            --results-dir ".codex/xcode-results" \
            --logs-dir ".codex/xcode-logs" \
            --summaries-dir ".codex/xcode-summaries"

      - name: Capture Motion screenshot matrix
        id: motion_shots
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-test-focused.sh \
            --batch "${SCREENSHOT_BATCH}" \
            --only-testing "AmbitionsUITests/AmbitionsUITests/testAMB965MotionReconstructionScreenshotMatrix" \
            --results-dir ".codex/xcode-results" \
            --logs-dir ".codex/xcode-logs" \
            --summaries-dir ".codex/xcode-summaries"

      - name: Capture You screenshot matrix
        id: you_shots
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-test-focused.sh \
            --batch "${SCREENSHOT_BATCH}" \
            --only-testing "AmbitionsUITests/AmbitionsUITests/testAMB966YouReconstructionScreenshotMatrix" \
            --results-dir ".codex/xcode-results" \
            --logs-dir ".codex/xcode-logs" \
            --summaries-dir ".codex/xcode-summaries"

      - name: Extract screenshots from result bundles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/report-screenshots/manual-extract/screenshots artifacts/report-screenshots/manual-extract/attachments
          if command -v xcparse >/dev/null 2>&1; then
            find ".codex/xcode-results/${SCREENSHOT_BATCH}" -name '*.xcresult' -type d -print 2>/dev/null | sort | while IFS= read -r result; do
              safe_name="$(printf '%s' "$result" | sed 's#[^A-Za-z0-9._-]#_#g')"
              out_root="artifacts/report-screenshots/manual-extract/${safe_name}"
              mkdir -p "$out_root/screenshots" "$out_root/attachments" "$out_root/logs"
              xcparse screenshots "$result" "$out_root/screenshots" || true
              xcparse attachments "$result" "$out_root/attachments" || true
              xcparse logs "$result" "$out_root/logs" || true
            done
          else
            echo "xcparse is missing. Install with: brew install chargepoint/xcparse/xcparse" > artifacts/report-screenshots/XCPARSE_MISSING.txt
          fi

      - name: Build screenshot review index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/report-screenshots
          SCREENSHOT_LIST="artifacts/report-screenshots/extracted-screenshots.txt"
          RESULT_LIST="artifacts/report-screenshots/result-bundles.txt"
          SUMMARY_LIST="artifacts/report-screenshots/summary-files.txt"
          INDEX="artifacts/report-screenshots/SCREENSHOT_REVIEW_INDEX.md"
          find ".codex/xcode-summaries/${SCREENSHOT_BATCH}" -path '*/extract/screenshots/*' -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -print 2>/dev/null | sort > "$SCREENSHOT_LIST" || true
          find "artifacts/report-screenshots/manual-extract" -path '*/screenshots/*' -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -print 2>/dev/null | sort >> "$SCREENSHOT_LIST" || true
          awk '!seen[$0]++' "$SCREENSHOT_LIST" > "${SCREENSHOT_LIST}.tmp" && mv "${SCREENSHOT_LIST}.tmp" "$SCREENSHOT_LIST"
          find ".codex/xcode-results/${SCREENSHOT_BATCH}" -maxdepth 5 -name '*.xcresult' -print 2>/dev/null | sort > "$RESULT_LIST" || true
          find ".codex/xcode-summaries/${SCREENSHOT_BATCH}" -type f -maxdepth 6 -print 2>/dev/null | sort > "$SUMMARY_LIST" || true
          {
            echo "# Ambitions Screenshot Review Index"
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo
            echo "## Focused UI screenshot runs"
            echo "- shell tabs: ${{ steps.shell_shots.outcome }}"
            echo "- Today matrix: ${{ steps.today_shots.outcome }}"
            echo "- Goals matrix: ${{ steps.goals_shots.outcome }}"
            echo "- activated Capture: ${{ steps.capture_shots.outcome }}"
            echo "- Time matrix: ${{ steps.time_shots.outcome }}"
            echo "- Motion matrix: ${{ steps.motion_shots.outcome }}"
            echo "- You matrix: ${{ steps.you_shots.outcome }}"
            echo
            echo "## Extracted screenshots"
            if [[ -s "$SCREENSHOT_LIST" ]]; then
              while IFS= read -r file; do
                rel="${file#./}"
                echo "- $rel"
              done < "$SCREENSHOT_LIST"
            else
              echo "- No extracted PNG screenshots found. Install xcparse on the runner or inspect the raw .xcresult bundles listed below."
            fi
            echo
            echo "## Result bundles"
            if [[ -s "$RESULT_LIST" ]]; then
              while IFS= read -r file; do
                echo "- $file"
              done < "$RESULT_LIST"
            else
              echo "- No result bundles found."
            fi
          } > "$INDEX"

      - name: Summarize screenshot proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/report-screenshots
          screenshot_count="0"
          if [[ -f artifacts/report-screenshots/extracted-screenshots.txt ]]; then
            screenshot_count="$(grep -c . artifacts/report-screenshots/extracted-screenshots.txt || true)"
          fi
          result_count="0"
          if [[ -f artifacts/report-screenshots/result-bundles.txt ]]; then
            result_count="$(grep -c . artifacts/report-screenshots/result-bundles.txt || true)"
          fi
          cat > artifacts/report-screenshots/SUMMARY.md <<EOF
          # Ambitions Report Screenshot Proof

          Commit: $(git rev-parse HEAD)

          Focused UI screenshot runs:
          - shell tabs: ${{ steps.shell_shots.outcome }}
          - Today matrix: ${{ steps.today_shots.outcome }}
          - Goals matrix: ${{ steps.goals_shots.outcome }}
          - activated Capture: ${{ steps.capture_shots.outcome }}
          - Time matrix: ${{ steps.time_shots.outcome }}
          - Motion matrix: ${{ steps.motion_shots.outcome }}
          - You matrix: ${{ steps.you_shots.outcome }}

          Artifact inventory:
          - extracted screenshot files: ${screenshot_count}
          - raw result bundles: ${result_count}

          Start with artifacts/report-screenshots/SCREENSHOT_REVIEW_INDEX.md.
          Artifacts include extracted screenshots when xcparse is installed, raw xcresult bundles otherwise, and focused test logs/summaries. This workflow collects every screenshot suite before failing at the final evaluation step.
          EOF

      - name: Upload screenshot proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-report-screenshot-proof
          path: |
            artifacts/report-screenshots/**
            artifacts-report-sim-health.json
            .codex/xcode-results/report-screenshot-proof/**
            .codex/xcode-logs/report-screenshot-proof/**
            .codex/xcode-summaries/report-screenshot-proof/**
          if-no-files-found: warn
          retention-days: 7

      - name: Evaluate screenshot proof outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "shell tabs:${{ steps.shell_shots.outcome }}" \
            "Today matrix:${{ steps.today_shots.outcome }}" \
            "Goals matrix:${{ steps.goals_shots.outcome }}" \
            "activated Capture:${{ steps.capture_shots.outcome }}" \
            "Time matrix:${{ steps.time_shots.outcome }}" \
            "Motion matrix:${{ steps.motion_shots.outcome }}" \
            "You matrix:${{ steps.you_shots.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "Screenshot proof failed: ${name} -> ${outcome}" >&2
              failed=1
            fi
          done
          if [[ -f artifacts/report-screenshots/extracted-screenshots.txt ]] && [[ -s artifacts/report-screenshots/extracted-screenshots.txt ]]; then
            echo "Extracted screenshot count: $(grep -c . artifacts/report-screenshots/extracted-screenshots.txt || true)"
          else
            echo "No extracted screenshots were found. Install xcparse or inspect raw xcresult bundles." >&2
          fi
          exit "$failed"
