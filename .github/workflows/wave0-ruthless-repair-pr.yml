name: Wave 0 Ruthless Repair PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/wave0-ruthless-repair.trigger"
      - ".github/workflows/wave0-ruthless-repair-pr.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply embedded repair script once
        shell: bash
        run: |
          if grep -q "## AUTH-005A — Normative engineering annex binding" docs/truth/PRODUCT_DESIGN_TRUTH.md && [ ! -f docs/constitution/opportunities/P0.json ]; then
            echo "Wave 0 ruthless repair already applied."
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/wave0-ruthless-repair.yml').read_text()
          start_token = "python3 <<'PY'\n"
          end_token = "\n          PY\n"
          start = workflow.index(start_token) + len(start_token)
          end = workflow.index(end_token, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<wave0-ruthless-repair>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Run strengthened constitutional audit
        run: |
          python3 -m py_compile scripts/ambitions-constitution-audit.py
          python3 scripts/ambitions-constitution-audit.py

      - name: Commit repaired candidate when changed
        run: |
          if git diff --quiet; then
            echo "No repair diff remains."
            exit 0
          fi
          git config user.name "ambitions-constitution-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/truth/PRODUCT_DESIGN_TRUTH.md docs/constitution scripts/ambitions-constitution-audit.py
          git commit -m "docs: bind and harden Wave 0 constitution after ruthless review"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
