name: Ambitions LocalRuntimeProof CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulator_name:
        required: true
        default: iPhone 17
        type: string
      scheme:
        required: true
        default: Ambitions
        type: string

permissions:
  contents: read

concurrency:
  group: ambitions-local-runtime-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-runtime-proof:
    name: local-runtime-proof
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 180
    env:
      RUN_STAMP: local-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}
      OUTPUT_ROOT: artifacts/local-runtime-proof/local-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}
      SCHEME: ${{ github.event_name == 'workflow_dispatch' && inputs.scheme || 'Ambitions' }}
      SIMULATOR_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.simulator_name || 'iPhone 17' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Run LocalRuntimeProof CI
        shell: bash
        run: bash scripts/ci/local_runtime_proof_ci.sh

      - name: Upload LocalRuntimeProof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-local-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/local-runtime-proof/**
          if-no-files-found: error
          retention-days: 30
