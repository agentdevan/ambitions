name: Ambitions Autopilot Train

on:
  workflow_dispatch:
    inputs:
      start_batch:
        required: true
        default: auto
        type: string
      max_batches:
        required: true
        default: '8'
        type: string
      gate_mode:
        required: true
        default: staged
        type: choice
        options:
          - staged
          - strict
      commit_changes:
        required: true
        default: true
        type: boolean
      run_xcode_build:
        required: true
        default: true
        type: boolean
      run_swift_tests:
        required: true
        default: false
        type: boolean
      run_launch_smoke:
        required: true
        default: false
        type: boolean
      self_dispatch:
        required: true
        default: true
        type: boolean
      cycles_remaining:
        required: true
        default: '3'
        type: string

  push:
    branches:
      - main
    paths:
      - scripts/release_recovery/apply_batch_*.py
      - scripts/release_recovery/autopilot*.py
      - scripts/release_recovery/self_dispatch_train.py

permissions:
  contents: write
  actions: write

concurrency:
  group: ambitions-autopilot-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 240
    env:
      START_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.start_batch || 'auto' }}
      MAX_BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_batches || '8' }}
      GATE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.gate_mode || 'staged' }}
      COMMIT_CHANGES: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_changes || 'true' }}
      RUN_XCODE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.run_xcode_build || 'true' }}
      RUN_SWIFT_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_swift_tests || 'false' }}
      RUN_LAUNCH_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_launch_smoke || 'false' }}
      SELF_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.self_dispatch || 'true' }}
      CYCLES_REMAINING: ${{ github.event_name == 'workflow_dispatch' && inputs.cycles_remaining || '3' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Toolchain proof
        shell: bash
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          echo "start_batch=${START_BATCH}"
          echo "max_batches=${MAX_BATCHES}"
          echo "gate_mode=${GATE_MODE}"
          echo "cycles_remaining=${CYCLES_REMAINING}"
          sw_vers || true
          xcodebuild -version
          xcode-select -p
          xcrun simctl list devices available | sed -n '1,160p'
          git status --short --branch
          git rev-parse HEAD

      - name: Run controlled train
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_recovery/self_dispatch_train.py \
            --start-batch "${START_BATCH}" \
            --max-batches "${MAX_BATCHES}" \
            --gate-mode "${GATE_MODE}" \
            --commit-changes "${COMMIT_CHANGES}" \
            --run-xcode-build "${RUN_XCODE_BUILD}" \
            --run-swift-tests "${RUN_SWIFT_TESTS}" \
            --run-launch-smoke "${RUN_LAUNCH_SMOKE}" \
            --self-dispatch "${SELF_DISPATCH}" \
            --cycles-remaining "${CYCLES_REMAINING}" \
            --workflow-file "ambitions-autopilot-train.yml" \
            --ref "main"

      - name: Upload proof artifacts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-autopilot-train-proof
          path: |
            artifacts/release-recovery/**/*.log
            artifacts/release-recovery/**/*.patch
            artifacts/release-recovery/**/*.md
            artifacts/release-recovery/**/*.json
            artifacts/release-recovery/**/*.txt
            artifacts/release-recovery/**/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 7
