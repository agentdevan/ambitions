name: Code Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      source_atlas: ${{ steps.scope.outputs.source_atlas }}
      shell: ${{ steps.scope.outputs.shell }}
      workflow: ${{ steps.scope.outputs.workflow }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          paths="$RUNNER_TEMP/changed-paths"
          git diff --name-only "$base" HEAD > "$paths"
          cat "$paths"
          has() { rg -q "$1" "$paths"; }
          has '^(Native/|Packages/|project\.yml$|Package\.swift$|Package\.resolved$|scripts/ambitions-xcode)' && native=true || native=false
          has '^(tools/source-atlas/|requirements-ci\.txt$)' && source_atlas=true || source_atlas=false
          has '^scripts/.*\.sh$' && shell=true || shell=false
          has '^\.github/workflows/' && workflow=true || workflow=false
          {
            echo "native=$native"
            echo "source_atlas=$source_atlas"
            echo "shell=$shell"
            echo "workflow=$workflow"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

  fast-checks:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          install_dir="$RUNNER_TEMP/gitleaks-${version}"
          mkdir -p "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors --output "$RUNNER_TEMP/$archive" "$url"
          echo "$expected_sha256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir" gitleaks
          chmod +x "$install_dir/gitleaks"
          "$install_dir/gitleaks" version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Whitespace and secrets
        env:
          GITHUB_BASE_SHA: ${{ needs.changes.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${GITHUB_BASE_SHA}" HEAD
          bash scripts/ci/ambitions-gitleaks-scan.sh --range-only
      - name: Product canon integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ambitions-canon.py check
          python3 -m unittest discover -s tools/tests -p 'test_ambitions_canon_compiler.py'
      - name: Capability Atlas program integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_capability_atlas_*.py'
          python3 tools/capability_atlas/taxonomy_cases.py
          python3 scripts/ambitions-capabilities.py build
          python3 tools/capability_atlas/review_validation.py build
      - name: Upload capability program outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-atlas-review-output
          if-no-files-found: error
          path: |
            docs/capabilities/candidate-capabilities.json
            docs/capabilities/CANDIDATE_CAPABILITY_INVENTORY.md
            docs/capabilities/discovery-coverage.json
            docs/capabilities/discovery-sources.json
            docs/capabilities/candidates/*.json
            docs/capabilities/sources/*.json
            docs/capabilities/classification-summary.json
            docs/capabilities/exclusion-register.json
            docs/capabilities/qualified-capability-candidates.json
            docs/capabilities/ambiguous-capability-candidates.json
            docs/capabilities/CLASSIFIED_CAPABILITY_INVENTORY.md
            docs/capabilities/exclusions/*.json
            docs/capabilities/qualified/*.json
            docs/capabilities/ambiguous/*.json
            docs/capabilities/taxonomy-validation.json
            docs/capabilities/capability-taxonomy.json
            docs/capabilities/CAPABILITY_TAXONOMY.md
            docs/capabilities/reconciliation-register.json
            docs/capabilities/CAPABILITY_RECONCILIATION.md
            docs/capabilities/draft-capability-atlas.json
            docs/capabilities/DRAFT_CAPABILITY_ATLAS.md
            docs/capabilities/draft-capability-traceability.json
            docs/capabilities/DRAFT_CAPABILITY_TRACEABILITY.md
            docs/capabilities/draft-capability-gaps.json
            docs/capabilities/DRAFT_CAPABILITY_GAP_REPORT.md
            docs/capabilities/owner-decisions.json
            docs/capabilities/OWNER_DECISION_PACKET.md
            docs/capabilities/review-validation.json
      - name: Reject capability program drift
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all -- \
            docs/capabilities/candidate-capabilities.json \
            docs/capabilities/CANDIDATE_CAPABILITY_INVENTORY.md \
            docs/capabilities/discovery-coverage.json \
            docs/capabilities/discovery-sources.json \
            docs/capabilities/candidates \
            docs/capabilities/sources \
            docs/capabilities/classification-summary.json \
            docs/capabilities/exclusion-register.json \
            docs/capabilities/qualified-capability-candidates.json \
            docs/capabilities/ambiguous-capability-candidates.json \
            docs/capabilities/CLASSIFIED_CAPABILITY_INVENTORY.md \
            docs/capabilities/exclusions \
            docs/capabilities/qualified \
            docs/capabilities/ambiguous \
            docs/capabilities/taxonomy-validation.json \
            docs/capabilities/review-validation.json)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "Run: python3 scripts/ambitions-capabilities.py build"
            echo "Run: python3 tools/capability_atlas/review_validation.py build"
            exit 1
          fi
      - name: SwiftLint
        if: needs.changes.outputs.native == 'true'
        env:
          GITHUB_BASE_SHA: ${{ needs.changes.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z "$GITHUB_BASE_SHA" HEAD -- '*.swift')
          if (( ${#files[@]} == 0 )); then
            echo "No Swift files changed."
            exit 0
          fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/realm/swiftlint:latest \
            swiftlint lint --strict --reporter github-actions-logging "${files[@]}"
      - name: Source-bound static checks
        if: needs.changes.outputs.native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ambitions-local-first-boundary-scan.py
          python3 scripts/ambitions-runtime-direct-write-audit.py
          python3 scripts/ci/ambitions-no-weak-implementation-scan.py
      - name: Source Atlas static checks
        if: needs.changes.outputs.source_atlas == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source-atlas-boundary-audit.py
          python3 scripts/source-atlas-no-private-graph-egress-audit.py
          python3 -m pip install -r requirements-ci.txt
          python3 -m pytest tools/source-atlas/foundry tools/source-atlas/tests
      - name: ShellCheck
        if: needs.changes.outputs.shell == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          git diff --name-only "${{ needs.changes.outputs.base }}" HEAD | rg '^scripts/.*\.sh$' | xargs -r shellcheck
      - name: Actionlint
        if: needs.changes.outputs.workflow == 'true'
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"

  ios-build-and-tests:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hostless external contract tests
        shell: bash
        run: swift test --package-path Packages/AmbitionsExternalContracts
      - name: Generate project and reject drift
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --exit-code -- Ambitions.xcodeproj
      - name: Build for testing
        shell: bash
        run: scripts/ambitions-xcode-build-for-testing.sh --batch code-quality --scheme AmbitionsSmoke --timeout 35m --kill-after 120s

  Code-Quality:
    name: Code Quality
    needs: [fast-checks, ios-build-and-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable checks
        env:
          FAST: ${{ needs.fast-checks.result }}
          IOS: ${{ needs.ios-build-and-tests.result }}
        run: |
          test "$FAST" = success
          test "$IOS" = success || test "$IOS" = skipped
