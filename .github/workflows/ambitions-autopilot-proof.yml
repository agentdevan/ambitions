name: Ambitions Autopilot Proof

on:
  workflow_dispatch:
    inputs:
      start_batch:
        required: true
        default: batch_01_guard_cleanup
        type: string
      max_batches:
        required: true
        default: '8'
        type: string
      gate_mode:
        required: true
        default: staged
        type: choice
        options:
          - staged
          - strict
      commit_changes:
        required: true
        default: true
        type: boolean
      run_xcode_build:
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: ambitions-autopilot-proof
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Toolchain proof
        shell: bash
        run: |
          set -euo pipefail
          sw_vers || true
          xcodebuild -version
          xcode-select -p
          xcrun simctl list devices available | sed -n '1,160p'
          git status --short --branch
          git rev-parse HEAD

      - name: Run autopilot
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--start-batch "${{ inputs.start_batch }}" --max-batches "${{ inputs.max_batches }}" --gate-mode "${{ inputs.gate_mode }}")
          if [[ "${{ inputs.commit_changes }}" == "true" ]]; then ARGS+=(--commit); fi
          if [[ "${{ inputs.run_xcode_build }}" == "true" ]]; then ARGS+=(--run-xcode-build); fi
          python3 scripts/release_recovery/autopilot.py "${ARGS[@]}"

      - name: Upload proof artifacts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-autopilot-proof
          path: |
            artifacts/release-recovery/**/*.log
            artifacts/release-recovery/**/*.patch
            artifacts/release-recovery/**/*.md
            artifacts/release-recovery/**/*.json
            artifacts/release-recovery/**/*.txt
            artifacts/release-recovery/**/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 7
