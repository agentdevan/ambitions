name: iOS Native Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ios-native-validation:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure XcodeGen spec exists
        run: |
          set -euo pipefail
          test -f project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native iOS project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail

          podfile_path="$(find . -name Podfile -print -quit)"
          if [[ -z "${podfile_path:-}" ]]; then
            echo "No Podfile found; skipping CocoaPods install."
            exit 0
          fi

          podfile_dir="$(dirname "$podfile_path")"

          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi

          cd "$podfile_dir"
          pod install

      - name: Discover generated Xcode inputs
        id: discover
        run: |
          set -euo pipefail

          project_path=""
          workspace_path=""
          scheme=""
          podfile_path="$(find . -name Podfile -print -quit)"

          project_name="$(ruby -ryaml -e 'data = YAML.safe_load(File.read("project.yml")) || {}; puts data["name"] if data["name"]')"
          scheme_count="$(ruby -ryaml -e 'data = YAML.safe_load(File.read("project.yml")) || {}; schemes = data["schemes"] || {}; puts schemes.keys.length')"

          if [[ -n "${project_name:-}" && -d "${project_name}.xcodeproj" ]]; then
            project_path="${project_name}.xcodeproj"
          fi

          if [[ "${scheme_count:-0}" == "1" ]]; then
            scheme="$(ruby -ryaml -e 'data = YAML.safe_load(File.read("project.yml")) || {}; schemes = data["schemes"] || {}; puts schemes.keys.first if schemes.keys.first')"
          fi

          if [[ -n "${podfile_path:-}" ]]; then
            podfile_dir="$(dirname "$podfile_path")"
            mapfile -t pod_workspaces < <(find "$podfile_dir" -maxdepth 1 -name "*.xcworkspace" -print | sort)
            if [[ "${#pod_workspaces[@]}" == "1" ]]; then
              workspace_path="${pod_workspaces[0]}"
            fi
          fi

          if [[ -z "$workspace_path" ]]; then
            mapfile -t workspaces < <(find . -maxdepth 4 -name "*.xcworkspace" -print | sort)
            if [[ "${#workspaces[@]}" == "1" ]]; then
              workspace_path="${workspaces[0]}"
            fi
          fi

          if [[ -z "$project_path" ]]; then
            mapfile -t projects < <(find . -maxdepth 4 -name "*.xcodeproj" -print | sort)
            if [[ "${#projects[@]}" == "1" ]]; then
              project_path="${projects[0]}"
            fi
          fi

          echo "project_path=$project_path" >> "$GITHUB_OUTPUT"
          echo "workspace_path=$workspace_path" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Validate generated native artifacts
        run: |
          set -euo pipefail

          if [[ -n "${{ steps.discover.outputs.workspace_path }}" ]]; then
            test -d "${{ steps.discover.outputs.workspace_path }}"
          elif [[ -n "${{ steps.discover.outputs.project_path }}" ]]; then
            test -d "${{ steps.discover.outputs.project_path }}"
          else
            echo "Expected a generated .xcodeproj or .xcworkspace, but none was found."
            exit 1
          fi

      - name: List Xcode targets
        run: |
          set -euo pipefail

          if [[ -n "${{ steps.discover.outputs.workspace_path }}" ]]; then
            xcodebuild -workspace "${{ steps.discover.outputs.workspace_path }}" -list
          elif [[ -n "${{ steps.discover.outputs.project_path }}" ]]; then
            xcodebuild -project "${{ steps.discover.outputs.project_path }}" -list
          else
            echo "No generated Xcode project or workspace to inspect."
            exit 1
          fi

      - name: Validate native iOS simulator build
        if: steps.discover.outputs.scheme != ''
        run: |
          set -euo pipefail

          xcode_args=()
          if [[ -n "${{ steps.discover.outputs.workspace_path }}" ]]; then
            xcode_args+=(-workspace "${{ steps.discover.outputs.workspace_path }}")
          elif [[ -n "${{ steps.discover.outputs.project_path }}" ]]; then
            xcode_args+=(-project "${{ steps.discover.outputs.project_path }}")
          else
            echo "No generated Xcode project or workspace to build."
            exit 1
          fi

          xcodebuild \
            "${xcode_args[@]}" \
            -scheme "${{ steps.discover.outputs.scheme }}" \
            -resolvePackageDependencies

          xcodebuild \
            "${xcode_args[@]}" \
            -scheme "${{ steps.discover.outputs.scheme }}" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
