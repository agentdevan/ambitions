name: iOS Native Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unit-archive:
    name: Build, Unit Tests, Archive
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-unit
      UNIT_XCRESULT_PATH: ${{ runner.temp }}/AmbitionsUnitTests.xcresult
      ARCHIVE_PATH: ${{ runner.temp }}/Ambitions.xcarchive
      IPA_PATH: ${{ runner.temp }}/Ambitions-unsigned.ipa
      IPA_NOTES_PATH: ${{ runner.temp }}/Ambitions-unsigned-ipa-notes.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Generate native iOS project
        run: |
          set -euo pipefail
          test -f project.yml
          xcodegen generate

      - name: Discover generated Xcode inputs
        id: discover
        run: |
          set -euo pipefail

          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          require "yaml"

          data = YAML.safe_load(File.read("project.yml")) || {}
          project_name = data["name"] or abort "project.yml is missing a top-level name."
          schemes = (data["schemes"] || {}).keys

          scheme_name =
            if schemes.include?("Ambitions")
              "Ambitions"
            elsif schemes.length == 1
              schemes.first
            else
              abort "Unable to determine scheme from project.yml. Found schemes: #{schemes.inspect}"
            end

          project_path = "#{project_name}.xcodeproj"
          abort "xcodegen did not generate #{project_path}" unless Dir.exist?(project_path)

          puts "project_path=#{project_path}"
          puts "scheme_name=#{scheme_name}"
          RUBY

      - name: List generated project details
        run: |
          set -euo pipefail
          echo "Project: ${{ steps.discover.outputs.project_path }}"
          echo "Scheme: ${{ steps.discover.outputs.scheme_name }}"
          xcodebuild -project "${{ steps.discover.outputs.project_path }}" -list

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ steps.discover.outputs.project_path }}" \
            -scheme "${{ steps.discover.outputs.scheme_name }}" \
            -resolvePackageDependencies

      - name: Select deterministic iOS simulator
        id: simulator
        run: |
          set -euo pipefail

          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          require "json"
          require "rubygems"

          preferred_devices = [
            "iPhone 16 Pro",
            "iPhone 16",
            "iPhone 15 Pro",
            "iPhone 15"
          ]

          devices_by_runtime = JSON.parse(`xcrun simctl list devices available -j`).fetch("devices")
          candidates = devices_by_runtime.flat_map do |runtime, devices|
            next [] unless runtime.include?("iOS")

            runtime_version = runtime[/iOS[-.](\d+(?:-\d+)*)/, 1]
            next [] unless runtime_version

            version = Gem::Version.new(runtime_version.tr("-", "."))

            devices.filter_map do |device|
              next unless device["isAvailable"]

              rank = preferred_devices.index(device["name"])
              next if rank.nil?

              {
                name: device["name"],
                udid: device["udid"],
                runtime: runtime,
                version: version,
                rank: rank
              }
            end
          end

          abort "No supported iOS simulator found. Available devices:\n#{`xcrun simctl list devices available`}" if candidates.empty?

          selected = candidates.max_by { |candidate| [candidate[:version], -candidate[:rank]] }

          puts "device_name=#{selected[:name]}"
          puts "device_udid=#{selected[:udid]}"
          puts "device_runtime=#{selected[:runtime]}"
          RUBY

      - name: Boot simulator
        run: |
          set -euo pipefail
          echo "Using ${{ steps.simulator.outputs.device_name }} (${{ steps.simulator.outputs.device_runtime }})"
          xcrun simctl boot "${{ steps.simulator.outputs.device_udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.device_udid }}" -b

      - name: Build native app target
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ steps.discover.outputs.project_path }}" \
            -scheme "${{ steps.discover.outputs.scheme_name }}" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run native unit tests
        run: |
          set -euo pipefail
          rm -rf "$UNIT_XCRESULT_PATH"
          xcodebuild \
            -project "${{ steps.discover.outputs.project_path }}" \
            -scheme "${{ steps.discover.outputs.scheme_name }}" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_udid }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$UNIT_XCRESULT_PATH" \
            -only-testing:AmbitionsTests \
            test

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-unit-tests-xcresult
          path: ${{ env.UNIT_XCRESULT_PATH }}
          if-no-files-found: ignore

      - name: Validate unsigned release archive
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_PATH"
          xcodebuild \
            -project "${{ steps.discover.outputs.project_path }}" \
            -scheme "${{ steps.discover.outputs.scheme_name }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA artifact
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/Ambitions.app"
          STAGING_DIR="$RUNNER_TEMP/ipa-staging"

          test -d "$APP_PATH"
          rm -rf "$STAGING_DIR" "$IPA_PATH"
          mkdir -p "$STAGING_DIR/Payload"
          cp -R "$APP_PATH" "$STAGING_DIR/Payload/Ambitions.app"

          (
            cd "$STAGING_DIR"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_PATH"
          )

          cat > "$IPA_NOTES_PATH" <<'EOF'
          This artifact is packaged from an unsigned iOS archive.
          It is useful for inspection and downstream packaging experiments, but it is not a signed installable build.
          Device sideloading or on-device testing still requires signing and provisioning outside this workflow.
          EOF

      - name: Upload unsigned archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-unsigned-xcarchive
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: ignore

      - name: Upload unsigned IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-unsigned-ipa
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.IPA_NOTES_PATH }}
          if-no-files-found: ignore

  ui-tests:
    name: UI Tests
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-ui
      UI_XCRESULT_PATH: ${{ runner.temp }}/AmbitionsUITests.xcresult

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Generate native iOS project
        run: |
          set -euo pipefail
          test -f project.yml
          xcodegen generate

      - name: Discover generated Xcode inputs
        id: discover
        run: |
          set -euo pipefail

          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          require "yaml"

          data = YAML.safe_load(File.read("project.yml")) || {}
          project_name = data["name"] or abort "project.yml is missing a top-level name."
          schemes = (data["schemes"] || {}).keys

          scheme_name =
            if schemes.include?("Ambitions")
              "Ambitions"
            elsif schemes.length == 1
              schemes.first
            else
              abort "Unable to determine scheme from project.yml. Found schemes: #{schemes.inspect}"
            end

          project_path = "#{project_name}.xcodeproj"
          abort "xcodegen did not generate #{project_path}" unless Dir.exist?(project_path)

          puts "project_path=#{project_path}"
          puts "scheme_name=#{scheme_name}"
          RUBY

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ steps.discover.outputs.project_path }}" \
            -scheme "${{ steps.discover.outputs.scheme_name }}" \
            -resolvePackageDependencies

      - name: Select deterministic iOS simulator
        id: simulator
        run: |
          set -euo pipefail

          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          require "json"
          require "rubygems"

          preferred_devices = [
            "iPhone 16 Pro",
            "iPhone 16",
            "iPhone 15 Pro",
            "iPhone 15"
          ]

          devices_by_runtime = JSON.parse(`xcrun simctl list devices available -j`).fetch("devices")
          candidates = devices_by_runtime.flat_map do |runtime, devices|
            next [] unless runtime.include?("iOS")

            runtime_version = runtime[/iOS[-.](\d+(?:-\d+)*)/, 1]
            next [] unless runtime_version

            version = Gem::Version.new(runtime_version.tr("-", "."))

            devices.filter_map do |device|
              next unless device["isAvailable"]

              rank = preferred_devices.index(device["name"])
              next if rank.nil?

              {
                name: device["name"],
                udid: device["udid"],
                runtime: runtime,
                version: version,
                rank: rank
              }
            end
          end

          abort "No supported iOS simulator found. Available devices:\n#{`xcrun simctl list devices available`}" if candidates.empty?

          selected = candidates.max_by { |candidate| [candidate[:version], -candidate[:rank]] }

          puts "device_name=#{selected[:name]}"
          puts "device_udid=#{selected[:udid]}"
          puts "device_runtime=#{selected[:runtime]}"
          RUBY

      - name: Boot simulator
        run: |
          set -euo pipefail
          echo "Using ${{ steps.simulator.outputs.device_name }} (${{ steps.simulator.outputs.device_runtime }})"
          xcrun simctl boot "${{ steps.simulator.outputs.device_udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.device_udid }}" -b

      - name: Build UI tests for testing
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ steps.discover.outputs.project_path }}" \
            -scheme "${{ steps.discover.outputs.scheme_name }}" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_udid }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AmbitionsUITests \
            build-for-testing

      - name: Run UI tests
        run: |
          set -euo pipefail
          rm -rf "$UI_XCRESULT_PATH"
          xcodebuild \
            -project "${{ steps.discover.outputs.project_path }}" \
            -scheme "${{ steps.discover.outputs.scheme_name }}" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_udid }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$UI_XCRESULT_PATH" \
            -only-testing:AmbitionsUITests \
            test-without-building

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-ui-tests-xcresult
          path: ${{ env.UI_XCRESULT_PATH }}
          if-no-files-found: ignore
