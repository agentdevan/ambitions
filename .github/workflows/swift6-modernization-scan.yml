name: Swift 6 Modernization Final Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-guardrails:
    name: Static guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run scanner self-test
        run: python3 scripts/ambitions-swift6-modernization-scan.py --self-test
      - name: Run scanner unit tests
        run: python3 tools/tests/test_ambitions_swift6_modernization_scan.py
      - name: Run strict repo scan
        run: python3 scripts/ambitions-swift6-modernization-scan.py . --strict

  native-final-gate:
    name: Native Swift 6 final gate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run Ambitions Swift 6 final gate
        run: bash scripts/ambitions-swift6-final-gate.sh
