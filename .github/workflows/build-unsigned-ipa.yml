name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme to build"
        required: true
        default: "Ambitions"
      configuration:
        description: "Xcode configuration"
        required: true
        default: "Release"

run-name: "Unsigned IPA · ${{ inputs.scheme }} · ${{ github.ref_name }}"

permissions:
  contents: read

concurrency:
  group: ambitions-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 60

    env:
      SCHEME: ${{ inputs.scheme }}
      CONFIGURATION: ${{ inputs.configuration }}
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      IPA_OUT: ${{ github.workspace }}/build/export/Ambitions-unsigned-${{ github.sha }}.ipa

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Print toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
          swift --version

      - name: Generate Xcode project when project.yml exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "project.yml" ]]; then
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            xcodegen generate
          fi

      - name: Resolve Xcode workspace/project
        id: xcode_container
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          workspaces=( *.xcworkspace )
          projects=( *.xcodeproj )

          if (( ${#workspaces[@]} > 0 )); then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=${workspaces[0]}" >> "$GITHUB_OUTPUT"
            echo "Using workspace: ${workspaces[0]}"
          elif (( ${#projects[@]} > 0 )); then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=${projects[0]}" >> "$GITHUB_OUTPUT"
            echo "Using project: ${projects[0]}"
          else
            echo "::error::No .xcworkspace or .xcodeproj found after optional XcodeGen generation."
            exit 1
          fi

      - name: List schemes
        shell: bash
        run: |
          set -euo pipefail
          KIND="${{ steps.xcode_container.outputs.kind }}"
          PATH_VALUE="${{ steps.xcode_container.outputs.path }}"

          if [[ "$KIND" == "workspace" ]]; then
            xcodebuild -list -workspace "$PATH_VALUE"
          else
            xcodebuild -list -project "$PATH_VALUE"
          fi

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs

          KIND="${{ steps.xcode_container.outputs.kind }}"
          PATH_VALUE="${{ steps.xcode_container.outputs.path }}"

          if [[ "$KIND" == "workspace" ]]; then
            xcodebuild \
              -resolvePackageDependencies \
              -workspace "$PATH_VALUE" \
              -scheme "$SCHEME" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              2>&1 | tee build/logs/resolve-packages.log
          else
            xcodebuild \
              -resolvePackageDependencies \
              -project "$PATH_VALUE" \
              -scheme "$SCHEME" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              2>&1 | tee build/logs/resolve-packages.log
          fi

      - name: Build app with code signing disabled
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs

          KIND="${{ steps.xcode_container.outputs.kind }}"
          PATH_VALUE="${{ steps.xcode_container.outputs.path }}"

          COMMON_ARGS=(
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$DERIVED_DATA"
            -skipPackagePluginValidation
            -skipMacroValidation
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            AD_HOC_CODE_SIGNING_ALLOWED=NO
            ONLY_ACTIVE_ARCH=NO
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO
          )

          if [[ "$KIND" == "workspace" ]]; then
            set -o pipefail
            xcodebuild -workspace "$PATH_VALUE" "${COMMON_ARGS[@]}" clean build 2>&1 | tee build/logs/xcodebuild.log
          else
            set -o pipefail
            xcodebuild -project "$PATH_VALUE" "${COMMON_ARGS[@]}" clean build 2>&1 | tee build/logs/xcodebuild.log
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$DERIVED_DATA/Build/Products/${CONFIGURATION}-iphoneos"
          echo "Looking for .app under: $PRODUCTS"

          APP_PATH="$(find "$PRODUCTS" -maxdepth 3 -type d -name "*.app" ! -name "*Tests.app" ! -name "*UITests.app" | head -n 1)"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No built .app found under $PRODUCTS"
            find "$DERIVED_DATA/Build/Products" -maxdepth 5 -print || true
            exit 1
          fi

          echo "Packaging app: $APP_PATH"

          rm -rf build/ipa build/export
          mkdir -p build/ipa/Payload build/export
          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          /usr/bin/zip -qry "$IPA_OUT" Payload
          cd "$GITHUB_WORKSPACE"

          test -s "$IPA_OUT"
          echo "Created unsigned IPA:"
          ls -lh "$IPA_OUT"
          unzip -l "$IPA_OUT" | sed -n '1,80p'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: Ambitions-unsigned-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ambitions-build-logs
          path: |
            build/logs/**
            build/DerivedData/Logs/**
          if-no-files-found: ignore
          retention-days: 14