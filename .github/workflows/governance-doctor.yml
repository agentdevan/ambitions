name: Ambitions Governance Doctor

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  governance-doctor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repo doctor strict
        run: |
          python3 scripts/governance/ambitions-repo-doctor.py --strict
