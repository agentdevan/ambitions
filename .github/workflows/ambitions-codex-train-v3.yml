name: Ambitions Connector Batch Validation

on:
  workflow_dispatch:
    inputs:
      train:
        required: true
        default: object-stage-mega-train
        type: string
      start_batch:
        required: true
        default: auto
        type: string
      end_batch:
        required: true
        default: auto
        type: string
      mode:
        required: true
        default: execute
        type: choice
        options:
          - dry-run
          - execute
      commit_strategy:
        required: true
        default: none
        type: choice
        options:
          - none
          - batch
      run_xcode_build:
        required: true
        default: true
        type: boolean
      run_tests:
        required: true
        default: none
        type: choice
        options:
          - none
          - focused
          - full
      max_batches:
        required: true
        default: '99'
        type: string
      rerun_completed:
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: ambitions-connector-batch-validation-${{ inputs.train }}
  cancel-in-progress: false

jobs:
  connector-batch-validation:
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Toolchain proof
        shell: bash
        run: |
          set -euo pipefail
          sw_vers || true
          xcodebuild -version
          xcode-select -p
          git status --short --branch
          git rev-parse HEAD

      - name: Runner syntax proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/codex/train_v3.py \
            scripts/codex/aom-completion-audit.py

      - name: Connector validation lane
        shell: bash
        run: |
          set -euo pipefail
          echo "Connector validation mode: ChatGPT/GitHub connector owns source edits; this workflow does not invoke codex."
          echo "Train: ${{ inputs.train }}"
          echo "Batch range: ${{ inputs.start_batch }} -> ${{ inputs.end_batch }}"
          echo "Mode: ${{ inputs.mode }}"
          echo "Commit strategy input retained for compatibility: ${{ inputs.commit_strategy }}"
          echo "Rerun completed input retained for compatibility: ${{ inputs.rerun_completed }}"

          git diff --check
          python3 scripts/ambitions_validate_authority_drift.py
          python3 scripts/ambitions-local-first-boundary-scan.py
          python3 scripts/codex/amb-master-canon-ia-validate.py

          python3 scripts/codex/aom-completion-audit.py \
            --train "trains/${{ inputs.train }}/train.json" \
            --state "artifacts/${{ inputs.train }}/train-state.json" \
            --from "${{ inputs.start_batch }}" \
            --to "${{ inputs.end_batch }}" || true

      - name: Xcode build validation
        if: ${{ inputs.run_xcode_build == true }}
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project Ambitions.xcodeproj \
            -scheme Ambitions \
            -resolvePackageDependencies
          xcodebuild \
            -project Ambitions.xcodeproj \
            -scheme Ambitions \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Focused test validation notice
        if: ${{ inputs.run_tests != 'none' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "run_tests=${{ inputs.run_tests }} requested."
          echo "This connector-validation workflow currently treats Xcode build as the blocking runner proof."
          echo "Run focused XCTest locally or add a repo-owned xcode test wrapper before making XCTest claims."

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-connector-batch-validation-proof
          path: |
            artifacts/codex-train-v3/**
            artifacts/object-stage-mega-train/**
          if-no-files-found: warn
          retention-days: 14
