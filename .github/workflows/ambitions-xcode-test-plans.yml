name: Ambitions Xcode Test Plans

on:
  workflow_dispatch:
    inputs:
      plan:
        description: Xcode test plan to run.
        required: true
        default: Smoke
        type: choice
        options:
          - Smoke
          - Runtime
          - Accessibility
          - Screenshots
          - ReleaseCandidate

permissions:
  contents: read

concurrency:
  group: ambitions-xcode-test-plans-${{ github.ref }}-${{ inputs.plan }}
  cancel-in-progress: false

jobs:
  xcode-test-plan:
    name: xcode-test-plan-${{ inputs.plan }}
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 180
    env:
      PLAN: ${{ inputs.plan }}
      RUN_STAMP: xcode-test-plan-${{ inputs.plan }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve scheme
        id: route
        shell: bash
        run: |
          set -euo pipefail
          case "${PLAN}" in
            Smoke) scheme="AmbitionsSmoke" ;;
            Runtime) scheme="AmbitionsRuntime" ;;
            Accessibility) scheme="AmbitionsAccessibility" ;;
            Screenshots) scheme="AmbitionsScreenshots" ;;
            ReleaseCandidate) scheme="AmbitionsReleaseCandidate" ;;
            *)
              echo "Unsupported plan: ${PLAN}" >&2
              exit 2
              ;;
          esac
          echo "scheme=${scheme}" >> "$GITHUB_OUTPUT"
          echo "scheme=${scheme}"

      - name: Build for testing
        shell: bash
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-build-for-testing.sh \
            --batch "${RUN_STAMP}-build-for-testing" \
            --scheme "${{ steps.route.outputs.scheme }}" \
            --timeout 45m \
            --kill-after 120s

      - name: Run selected test plan
        shell: bash
        run: |
          set -euo pipefail
          scripts/ambitions-xcode-test-plan.sh \
            --batch "${RUN_STAMP}" \
            --scheme "${{ steps.route.outputs.scheme }}" \
            --test-plan "${PLAN}"

      - name: Upload Xcode plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-xcode-test-plan-${{ inputs.plan }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .codex/xcode-results/**
            .codex/xcode-logs/**
            .codex/xcode-summaries/**
          if-no-files-found: warn
          retention-days: 14
