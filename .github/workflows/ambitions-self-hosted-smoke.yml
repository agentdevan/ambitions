name: Ambitions Self-Hosted Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ambitions-self-hosted-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Self-hosted Xcode smoke
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          sw_vers || true
          uname -a

      - name: Xcode and simulator availability
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available | sed -n '1,120p'

      - name: Repo status
        shell: bash
        run: |
          set -euo pipefail
          git status --short --branch
          git rev-parse HEAD

      - name: Release guard dry run
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/ambitions-release-red-guard.py
          python3 scripts/ambitions-copy-contract-lint.py
          python3 scripts/ambitions-empty-action-lint.py
          python3 scripts/ambitions-first-viewport-card-lint.py
