name: Ambitions Canon Authorization

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request number targeting current main
        required: true
        type: string
      intake_json:
        description: Exact canonical task-intake JSON
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: canon-authorization-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Sign exact event and owner approval
    if: github.ref == 'refs/heads/main' && github.actor == 'agentdevan' && github.actor_id == '529921'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Ambitions Canon Authorization
    outputs:
      base_sha: ${{ steps.metadata.outputs.base_sha }}
      head_sha: ${{ steps.metadata.outputs.head_sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify immutable trusted checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve immutable pull request metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pr.json").read_text())
          number = payload.get("number")
          base = payload.get("base", {})
          head = payload.get("head", {})
          if (
              payload.get("state") != "open"
              or base.get("ref") != "main"
              or not isinstance(number, int)
              or str(number) != os.environ["PR_NUMBER"]
          ):
              raise SystemExit("pull request is not an open exact-main candidate")
          base_sha = base.get("sha")
          head_sha = head.get("sha")
          if not all(isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value) for value in (base_sha, head_sha)):
              raise SystemExit("pull request commit identity is malformed")
          if base_sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("pull request base is stale relative to trusted workflow ref")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"base_sha={base_sha}\n")
              output.write(f"head_sha={head_sha}\n")
          PY

      - name: Materialize intake and fetch candidate object as data
        env:
          INTAKE_JSON: ${{ inputs.intake_json }}
          BASE_SHA: ${{ steps.metadata.outputs.base_sha }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(os.environ["INTAKE_JSON"])
          if not isinstance(value, dict):
              raise SystemExit("intake is not a JSON object")
          path = Path(os.environ["RUNNER_TEMP"]) / "task-intake.json"
          path.write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          git fetch --no-tags origin "$HEAD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"

      - name: Sign event and approval and compute exact task start
        env:
          AMBITIONS_CANON_APPROVAL_PRIVATE_KEY: ${{ secrets.AMBITIONS_CANON_APPROVAL_PRIVATE_KEY }}
          AMBITIONS_CANON_ATTESTATION_PRIVATE_KEY: ${{ secrets.AMBITIONS_CANON_ATTESTATION_PRIVATE_KEY }}
          BASE_SHA: ${{ steps.metadata.outputs.base_sha }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          python3 scripts/ambitions-canon-platform-attest.py --repo-root . start \
            --intake-json "$RUNNER_TEMP/task-intake.json" \
            --base-ref refs/heads/main \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pull-request-number "$PR_NUMBER" \
            --verification-epoch "$(date -u +%s)" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --authenticated-principal owner:devan \
            --output-dir "$RUNNER_TEMP/canon-start"

      - name: Export trusted validation matrix
        id: matrix
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "canon-start" / "validation-matrix.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          compact = json.dumps(value, sort_keys=True, separators=(",", ":"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"matrix={compact}\n")
          PY

      - name: Upload signed task-start artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canon-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canon-start
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate ${{ matrix.command_id }}
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}

    steps:
      - name: Checkout trusted command runner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: trusted
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.base_sha }}

      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.head_sha }}

      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download signed task-start artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canon-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: canon-start

      - name: Run exact base-owned command
        env:
          COMMAND_ID: ${{ matrix.command_id }}
        run: |
          cd trusted
          python3 scripts/ambitions-canon-platform-run-command.py \
            --repo-root . \
            --candidate-root ../candidate \
            --authorization ../canon-start/task-authorization.json \
            --command-id "$COMMAND_ID"

  attest:
    name: Sign validations and exact finalization
    needs:
      - authorize
      - validate
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Ambitions Canon Authorization

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.base_sha }}

      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download signed task-start artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canon-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: canon-start

      - name: Fetch candidate object as data
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Bind Green GitHub job logs as validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"])
          authorization = json.loads(Path("canon-start/task-authorization.json").read_text())
          response = subprocess.run(
              [
                  "gh", "api",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?filter=latest&per_page=100",
              ],
              check=True,
              capture_output=True,
          )
          jobs = json.loads(response.stdout)["jobs"]
          evidence = {}
          for command_id in authorization["computed_required_checks"]:
              expected_name = f"Validate {command_id}"
              matches = [job for job in jobs if job.get("name") == expected_name]
              if len(matches) != 1 or matches[0].get("conclusion") != "success":
                  raise SystemExit(f"missing Green GitHub job: {expected_name}")
              logs = subprocess.run(
                  [
                      "gh", "api",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{matches[0]['id']}/logs",
                  ],
                  check=True,
                  capture_output=True,
              ).stdout
              digest = hashlib.sha256(logs).hexdigest()
              if digest == "0" * 64:
                  raise SystemExit("GitHub job log produced the null digest")
              evidence[command_id] = {
                  "status": "green",
                  "exit_status": 0,
                  "artifact_digest": digest,
              }
          (root / "validation-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Sign validations and finalize exact range
        env:
          AMBITIONS_CANON_ATTESTATION_PRIVATE_KEY: ${{ secrets.AMBITIONS_CANON_ATTESTATION_PRIVATE_KEY }}
        run: |
          python3 scripts/ambitions-canon-platform-attest.py --repo-root . finalize \
            --authorization canon-start/task-authorization.json \
            --trusted-event canon-start/trusted-event.json \
            --approval-attestation canon-start/approval-attestation.json \
            --evidence "$RUNNER_TEMP/validation-evidence.json" \
            --output-dir "$RUNNER_TEMP/canon-finalization"

      - name: Upload signed finalization artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canon-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canon-finalization
          if-no-files-found: error
          retention-days: 30
