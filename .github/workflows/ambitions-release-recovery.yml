name: Ambitions Release Recovery

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Recovery batch to run
        required: true
        default: batch_01_guard_cleanup
        type: choice
        options:
          - batch_01_guard_cleanup
      commit_changes:
        description: Commit and push runner changes if validation reaches the configured gate
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: ambitions-release-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Release recovery ${{ inputs.batch }}
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Runner proof
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "runner_workspace=${RUNNER_WORKSPACE:-unknown}"
          sw_vers || true
          xcodebuild -version
          xcode-select -p
          xcrun simctl list devices available | sed -n '1,160p'
          git status --short --branch
          git rev-parse HEAD

      - name: Apply recovery batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-recovery
          case "${{ inputs.batch }}" in
            batch_01_guard_cleanup)
              python3 scripts/release_recovery/apply_batch_01_guard_cleanup.py | tee artifacts/release-recovery/batch_01_apply.log
              ;;
            *)
              echo "Unknown batch: ${{ inputs.batch }}" >&2
              exit 2
              ;;
          esac
          git diff --stat | tee artifacts/release-recovery/batch_diff_stat.log
          git diff -- Native Sources scripts .github | tee artifacts/release-recovery/batch.patch

      - name: Guard validation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/release-recovery
          {
            python3 scripts/ambitions-release-red-guard.py
            python3 scripts/ambitions-copy-contract-lint.py
            python3 scripts/ambitions-empty-action-lint.py
            python3 scripts/ambitions-first-viewport-card-lint.py
          } 2>&1 | tee artifacts/release-recovery/guard_validation.log

      - name: Swift package validation
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          swift test 2>&1 | tee artifacts/release-recovery/swift_test.log

      - name: Xcode build validation
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Ambitions \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath artifacts/release-recovery/DerivedData \
            build 2>&1 | tee artifacts/release-recovery/xcodebuild.log

      - name: Commit validated recovery changes
        if: ${{ inputs.commit_changes == true }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "ambitions-recovery-runner"
          git config user.email "actions@users.noreply.github.com"
          git add Native Sources scripts .github artifacts/release-recovery
          git commit -m "Apply Ambitions release recovery ${{ inputs.batch }}"
          git push origin HEAD:main

      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-release-recovery-${{ inputs.batch }}
          path: artifacts/release-recovery
          if-no-files-found: warn
          retention-days: 3
