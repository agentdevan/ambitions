name: Ambitions PR Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ambitions-pr-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_scope:
    name: pr-scope
    runs-on: ubuntu-latest
    outputs:
      active_law: ${{ steps.scope.outputs.active_law }}
      source_atlas: ${{ steps.scope.outputs.source_atlas }}
      xcode_runtime: ${{ steps.scope.outputs.xcode_runtime }}
      shell: ${{ steps.scope.outputs.shell }}
      markdown: ${{ steps.scope.outputs.markdown }}
      yaml: ${{ steps.scope.outputs.yaml }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify introduced paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "${base_ref}"
          base="$(git merge-base HEAD "origin/${base_ref}")"
          paths="${RUNNER_TEMP}/ambitions-pr-changed-paths.txt"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git ls-files > "$paths"
          else
            git diff --name-only "$base" HEAD > "$paths"
          fi
          echo "base_sha=${base}" >> "$GITHUB_OUTPUT"
          echo "base=${base}"
          echo "changed_paths:"
          sed 's/^/  /' "$paths"

          classify() {
            local scope="$1"
            local output="$2"
            local applicable=false
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              applicable=true
            elif python3 scripts/ci/ambitions-pr-scope.py "$scope" < "$paths"; then
              applicable=true
            else
              local status=$?
              if [[ "$status" -ne 1 ]]; then
                exit "$status"
              fi
            fi
            echo "${output}=${applicable}" >> "$GITHUB_OUTPUT"
            echo "${output}=${applicable}"
          }

          classify active-law active_law
          classify source-atlas source_atlas
          classify xcode-runtime xcode_runtime
          classify shell shell
          classify markdown markdown
          classify yaml yaml

  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run repo hygiene
        shell: bash
        run: bash scripts/ci/ambitions-pr-hygiene.sh

  ambitions-law-audit:
    name: ambitions-law-audit
    needs: pr_scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Ambitions law audits
        if: needs.pr_scope.outputs.active_law == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ambitions-green-standard-audit.py
          bash scripts/privacy-boundary-scan.sh
          bash scripts/release-claim-safety-scan.sh
          python3 scripts/ambitions-local-runtime-proof.py
          python3 scripts/ci/ambitions-no-weak-implementation-scan.py
      - name: Skip Ambitions law audits
        if: needs.pr_scope.outputs.active_law != 'true'
        shell: bash
        run: echo "No active product/source/law paths changed; Ambitions law audits skipped."

  remediation-governance-check:
    name: remediation-governance-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run remediation governance guard
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-main}"
          python3 scripts/ambitions-remediation-governance-check.py --base "origin/${base_ref}"
          python3 scripts/ambitions-remediation-governance-check.py --self-test

  source-atlas-boundary-audit:
    name: source-atlas-boundary-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Source Atlas boundary audits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source-atlas-boundary-audit.py
          python3 scripts/source-atlas-no-private-graph-egress-audit.py
          python3 scripts/source-atlas-no-private-graph-egress-audit.py --self-test

  swiftlint:
    name: swiftlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint in local container
        shell: bash
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/realm/swiftlint:latest swiftlint lint --strict --reporter github-actions-logging

  semgrep-local:
    name: semgrep-local
    needs: pr_scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Semgrep local CLI
        if: needs.pr_scope.outputs.source_atlas == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep
      - name: Run repo-local Semgrep rules
        if: needs.pr_scope.outputs.source_atlas == 'true'
        shell: bash
        run: semgrep scan --config .semgrep/ambitions-source-atlas.yml --error
      - name: Skip Semgrep
        if: needs.pr_scope.outputs.source_atlas != 'true'
        shell: bash
        run: echo "No Source Atlas implementation/config paths changed; Semgrep skipped."

  shellcheck:
    name: shellcheck
    needs: pr_scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ShellCheck
        if: needs.pr_scope.outputs.shell == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Run ShellCheck
        if: needs.pr_scope.outputs.shell == 'true'
        shell: bash
        run: |
          set -euo pipefail
          paths="${RUNNER_TEMP}/ambitions-shell-paths.txt"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git ls-files | python3 scripts/ci/ambitions-pr-scope.py shell --format paths > "$paths"
          else
            git diff --name-only "${{ needs.pr_scope.outputs.base_sha }}" HEAD \
              | python3 scripts/ci/ambitions-pr-scope.py shell --format paths > "$paths"
          fi
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < "$paths"
          printf 'ShellCheck changed paths:\n  %s\n' "${files[@]}"
          shellcheck "${files[@]}"
      - name: Skip ShellCheck
        if: needs.pr_scope.outputs.shell != 'true'
        shell: bash
        run: echo "No changed shell scripts; ShellCheck skipped."

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v actionlint >/dev/null 2>&1; then
            go install github.com/rhysd/actionlint/cmd/actionlint@latest
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi
      - name: Run actionlint
        shell: bash
        run: actionlint

  docs-lint:
    name: docs-lint
    needs: pr_scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install docs linters
        if: needs.pr_scope.outputs.markdown == 'true' || needs.pr_scope.outputs.yaml == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g markdownlint-cli2
          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint
      - name: Run markdownlint
        if: needs.pr_scope.outputs.markdown == 'true'
        shell: bash
        run: |
          set -euo pipefail
          paths="${RUNNER_TEMP}/ambitions-markdown-paths.txt"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git ls-files | python3 scripts/ci/ambitions-pr-scope.py markdown --format paths > "$paths"
          else
            git diff --name-only "${{ needs.pr_scope.outputs.base_sha }}" HEAD \
              | python3 scripts/ci/ambitions-pr-scope.py markdown --format paths > "$paths"
          fi
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < "$paths"
          printf 'markdownlint changed paths:\n  %s\n' "${files[@]}"
          markdownlint-cli2 --no-globs "${files[@]}"
      - name: Skip markdownlint
        if: needs.pr_scope.outputs.markdown != 'true'
        shell: bash
        run: echo "No changed Markdown files; markdownlint skipped."
      - name: Run yamllint
        if: needs.pr_scope.outputs.yaml == 'true'
        shell: bash
        run: |
          set -euo pipefail
          paths="${RUNNER_TEMP}/ambitions-yaml-paths.txt"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git ls-files | python3 scripts/ci/ambitions-pr-scope.py yaml --format paths > "$paths"
          else
            git diff --name-only "${{ needs.pr_scope.outputs.base_sha }}" HEAD \
              | python3 scripts/ci/ambitions-pr-scope.py yaml --format paths > "$paths"
          fi
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < "$paths"
          printf 'yamllint changed paths:\n  %s\n' "${files[@]}"
          yamllint "${files[@]}"
      - name: Skip yamllint
        if: needs.pr_scope.outputs.yaml != 'true'
        shell: bash
        run: echo "No changed relevant YAML files; yamllint skipped."

  secrets-scan:
    name: secrets-scan
    needs: pr_scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run Gitleaks locally
        env:
          GITHUB_BASE_SHA: ${{ needs.pr_scope.outputs.base_sha }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            bash scripts/ci/ambitions-gitleaks-scan.sh
          else
            bash scripts/ci/ambitions-gitleaks-scan.sh --range-only
          fi

  python-tests:
    name: python-tests
    needs: pr_scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python CI dependencies
        if: needs.pr_scope.outputs.source_atlas == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-ci.txt
      - name: Run Source Atlas Python tests
        if: needs.pr_scope.outputs.source_atlas == 'true'
        shell: bash
        run: python3 -m pytest tools/source-atlas/foundry tools/source-atlas/tests
      - name: Skip Source Atlas Python tests
        if: needs.pr_scope.outputs.source_atlas != 'true'
        shell: bash
        run: echo "No Source Atlas implementation/config paths changed; Python tests skipped."

  xcode-build-for-testing:
    name: xcode-build-for-testing
    needs: pr_scope
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install XcodeGen if needed
        if: needs.pr_scope.outputs.xcode_runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Run build-for-testing
        if: needs.pr_scope.outputs.xcode_runtime == 'true'
        shell: bash
        run: scripts/ambitions-xcode-build-for-testing.sh --batch green-standard
      - name: Skip build-for-testing
        if: needs.pr_scope.outputs.xcode_runtime != 'true'
        shell: bash
        run: echo "No production/package/project/Xcode-tooling paths changed; Xcode build-for-testing skipped for this PR."

  needs-repair-proof:
    name: needs-repair-proof
    needs: pr_scope
    runs-on: [self-hosted, Ambitions-XCode26]
    timeout-minutes: 150
    env:
      AMBITIONS_SIM_HEALTH_TIMEOUT: 60s
      AMBITIONS_XCODE_SIM_HEALTH_TIMEOUT: 60s
      AMBITIONS_XCODE_UI_PREBUILD_TIMEOUT: 45m
      AMBITIONS_XCODE_UI_PREBUILD_KILL_AFTER: 180s
      AMBITIONS_XCODE_UI_PREBUILD: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install XcodeGen if needed
        if: needs.pr_scope.outputs.xcode_runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Run static repair gates
        if: needs.pr_scope.outputs.xcode_runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --check
          scripts/ambitions-xcodegen-needed.sh
          python3 scripts/ambitions-remediation-governance-check.py
          python3 scripts/ambitions-quality-gate.py
          python3 scripts/ambitions-architecture-inventory.py
          python3 scripts/ambitions-green-standard-audit.py
          python3 scripts/ambitions-vocabulary-drift-scan.py
          python3 scripts/ambitions-local-first-boundary-scan.py
          python3 scripts/source-atlas-boundary-audit.py
          python3 scripts/source-atlas-no-private-graph-egress-audit.py
      - name: Run Needs Repair proof lanes
        if: needs.pr_scope.outputs.xcode_runtime == 'true'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .codex/needs-repair-proof .codex/xcode-logs .codex/xcode-results .codex/xcode-summaries
          summary=".codex/needs-repair-proof/summary.jsonl"
          : > "$summary"
          overall=0

          run_lane() {
            local issue="$1"
            local kind="$2"
            local command_text="$3"
            shift 3
            local log=".codex/needs-repair-proof/${issue}-${kind}.log"
            echo "::group::${issue} ${kind}"
            echo "${command_text}"
            local start end duration status
            start="$(date +%s)"
            set +e
            "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            end="$(date +%s)"
            duration=$((end - start))
            python3 - "$summary" "$issue" "$kind" "$status" "$duration" "$log" "$command_text" <<'PY'
          import json
          import sys
          from pathlib import Path
          summary, issue, kind, status, duration, log, command = sys.argv[1:]
          record = {
              "issue": issue,
              "kind": kind,
              "status": int(status),
              "result": "passed" if int(status) == 0 else "failed",
              "duration_seconds": int(duration),
              "log_file": log,
              "command": command,
          }
          Path(summary).open("a", encoding="utf-8").write(json.dumps(record, sort_keys=True) + "\n")
          PY
            if [[ "$status" -ne 0 ]]; then
              overall=1
            fi
            echo "::endgroup::"
          }

          run_lane AMB-1818_AMB-1819_AMB-1820 build-for-testing \
            "scripts/ambitions-xcode-build-for-testing.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme Ambitions --timeout 60m --kill-after 180s" \
            scripts/ambitions-xcode-build-for-testing.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme Ambitions --timeout 60m --kill-after 180s

          run_lane AMB-1808 focused-unit \
            "scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/AppIntentCommandRoutingInventoryTests --timeout 25m --kill-after 180s" \
            scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/AppIntentCommandRoutingInventoryTests --timeout 25m --kill-after 180s

          run_lane AMB-1809 focused-unit \
            "scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/ExternalWidgetLiveActivityScopeAllowlistTests --timeout 25m --kill-after 180s" \
            scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/ExternalWidgetLiveActivityScopeAllowlistTests --timeout 25m --kill-after 180s

          run_lane AMB-1811 focused-unit \
            "scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/EventKitIntegrationServiceTests/testCreateReminderFailsWhenAuthorizationDenied --timeout 25m --kill-after 180s" \
            scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/EventKitIntegrationServiceTests/testCreateReminderFailsWhenAuthorizationDenied --timeout 25m --kill-after 180s

          run_lane AMB-1814 focused-unit \
            "scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/AccessibilityNutritionChecklistTests --timeout 25m --kill-after 180s" \
            scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/AccessibilityNutritionChecklistTests --timeout 25m --kill-after 180s

          run_lane AMB-1816 focused-unit \
            "scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/RuntimeEventReplayPerformanceSmokeTests --timeout 25m --kill-after 180s" \
            scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --test AmbitionsTests/RuntimeEventReplayPerformanceSmokeTests --timeout 25m --kill-after 180s

          run_lane AMB-1758 focused-unit \
            "scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --only-testing AmbitionsTests/ExternalSurfaceSnapshotTests --timeout 25m --kill-after 180s" \
            scripts/ambitions-xcode-test-focused.sh --batch AMB_NEEDS_REPAIR_PROOF --scheme AmbitionsUnitTests --only-testing AmbitionsTests/ExternalSurfaceSnapshotTests --timeout 25m --kill-after 180s

          run_lane AMB-1815 deterministic-screenshot \
            "scripts/ambitions-run-deterministic-screenshot-lane.sh --batch AMB_NEEDS_REPAIR_PROOF --timeout 35m --kill-after 180s" \
            scripts/ambitions-run-deterministic-screenshot-lane.sh --batch AMB_NEEDS_REPAIR_PROOF --timeout 35m --kill-after 180s

          python3 - "$summary" <<'PY'
          import json
          import sys
          from pathlib import Path
          summary = Path(sys.argv[1])
          records = [json.loads(line) for line in summary.read_text(encoding="utf-8").splitlines() if line.strip()]
          failed = [r for r in records if r["status"] != 0]
          print(json.dumps({
              "lane_count": len(records),
              "passed_count": len(records) - len(failed),
              "failed_count": len(failed),
              "failed_issues": [r["issue"] for r in failed],
          }, indent=2, sort_keys=True))
          PY
          exit "$overall"
      - name: Upload Needs Repair proof artifacts
        if: always() && needs.pr_scope.outputs.xcode_runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ambitions-needs-repair-proof
          path: |
            .codex/needs-repair-proof/**
            .codex/xcode-logs/**
            .codex/xcode-results/**
            .codex/xcode-summaries/**
          if-no-files-found: warn
      - name: Skip Needs Repair proof lanes
        if: needs.pr_scope.outputs.xcode_runtime != 'true'
        shell: bash
        run: echo "No production/package/project/Xcode-tooling paths changed; Needs Repair proof lanes skipped."
